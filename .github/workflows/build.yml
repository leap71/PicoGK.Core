name: Build PicoGK.Core

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

# Jobs are read-only unless they explicitly request additional permissions.
permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-15
            rid: osx-arm64
          - name: Windows-x64
            os: windows-2025
            rid: win-x64
          - name: Linux-x64
            os: ubuntu-22.04
            rid: linux-x64

    name: Native / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DPICOGK_RID=${{ matrix.rid }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build runtime
        shell: bash
        run: cmake --build build --config Release --target PicoGKRuntime

      - name: Audit macOS dependency paths
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          native="artifacts/runtimes/${{ matrix.rid }}/native"
          for lib in "$native"/*.dylib; do
            echo "--- $lib"
            otool -L "$lib"
          done
          if otool -L "$native"/*.dylib | grep -E '/opt/homebrew|/usr/local|/Users/|/Volumes/'; then
            echo "Non-relocatable build-machine path found in native artifact."
            exit 1
          fi

      - name: Audit Linux dependency paths
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          native="artifacts/runtimes/${{ matrix.rid }}/native"

          readelf -d "$native/picogk.so" | grep -E 'NEEDED|RPATH|RUNPATH' || true
          ldd "$native/picogk.so"

          if ldd "$native"/*.so | grep -q 'not found'; then
            echo "Unresolved native dependency found."
            exit 1
          fi

          if readelf -d "$native/picogk.so" | grep -E 'RPATH|RUNPATH' | grep -E '/home/runner|/usr/local|/opt/'; then
            echo "Build-machine absolute path found in ELF runpath."
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test managed/native integration
        shell: bash
        run: >-
          dotnet test tests/PicoGK.Core.Tests/PicoGK.Core.Tests.csproj
          -c Release
          --runtime ${{ matrix.rid }}

      - name: Upload native runtime
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/runtimes/${{ matrix.rid }}/native/
          if-no-files-found: error

  package:
    name: Build and pack PicoGK.Core
    needs: native
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Compute package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="3.0.0-alpha.1"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid package version: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download macOS runtime
        uses: actions/download-artifact@v8
        with:
          name: native-osx-arm64
          path: artifacts/runtimes/osx-arm64/native

      - name: Download Windows runtime
        uses: actions/download-artifact@v8
        with:
          name: native-win-x64
          path: artifacts/runtimes/win-x64/native

      - name: Download Linux runtime
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: artifacts/runtimes/linux-x64/native

      - name: Restore
        run: >-
          dotnet restore src/PicoGK.Core/PicoGK.Core.csproj
          -p:Version="${{ steps.version.outputs.version }}"

      - name: Build managed library
        run: >-
          dotnet build src/PicoGK.Core/PicoGK.Core.csproj
          -c Release
          --no-restore
          -p:Version="${{ steps.version.outputs.version }}"

      - name: Pack
        run: >-
          dotnet pack src/PicoGK.Core/PicoGK.Core.csproj
          -c Release
          --no-build
          -p:Version="${{ steps.version.outputs.version }}"
          -o artifacts/packages

      - name: Verify package runtime layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import zipfile

          pkg = glob.glob('artifacts/packages/*.nupkg')[0]
          names = set(zipfile.ZipFile(pkg).namelist())

          expected = {
              'runtimes/osx-arm64/native/libtbb.12.dylib',
              'runtimes/osx-arm64/native/picogk.dylib',
              'runtimes/win-x64/native/picogk.dll',
              'runtimes/win-x64/native/tbb12.dll',
              'runtimes/linux-x64/native/libtbb.so.12',
              'runtimes/linux-x64/native/picogk.so',
          }

          missing = sorted(expected - names)
          malformed = sorted(
              name for name in names
              if name.startswith('runtimes/') and len(name.split('/')) != 4
          )

          if missing:
              print('Missing runtime entries:')
              print('\n'.join(missing))

          if malformed:
              print('Malformed runtime entries:')
              print('\n'.join(malformed))

          if missing or malformed:
              sys.exit(1)
          PY

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: PicoGK.Core-NuGet
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  package-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-15
            rid: osx-arm64
          - name: Windows-x64
            os: windows-2025
            rid: win-x64
          - name: Linux-x64
            os: ubuntu-22.04
            rid: linux-x64

    name: NuGet package / ${{ matrix.name }}
    needs: package
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: PicoGK.Core-NuGet
          path: artifacts/packages

      - name: Restore package consumer tests
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(ls artifacts/packages/*.nupkg | head -n 1)
          version=$(basename "$pkg" .nupkg)
          version=${version#PicoGK.Core.}
          packages_dir="$PWD/.package-test/nuget"
          rm -rf "$packages_dir"

          echo "PACKAGES_DIR=$packages_dir" >> "$GITHUB_ENV"
          echo "PICOGK_PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

          # Force PicoGK.Core to come from this workflow's artifact. Source
          # ordering alone does not guarantee that NuGet selects the local copy.
          config="$PWD/.package-test/NuGet.config"
          mkdir -p "$(dirname "$config")"
          cat > "$config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$GITHUB_WORKSPACE/artifacts/packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="PicoGK.Core" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

          dotnet restore tests/PicoGK.Core.PackageTests/PicoGK.Core.PackageTests.csproj \
            --configfile "$config" \
            -p:RestorePackagesPath="$packages_dir" \
            -p:PicoGKPackageVersion="$version" \
            -p:RuntimeIdentifier="${{ matrix.rid }}"

      - name: Run package consumer tests
        shell: bash
        run: >-
          dotnet test tests/PicoGK.Core.PackageTests/PicoGK.Core.PackageTests.csproj
          -c Release
          --no-restore
          -p:RestorePackagesPath="$PACKAGES_DIR"
          -p:PicoGKPackageVersion="$PICOGK_PACKAGE_VERSION"
          -p:RuntimeIdentifier=${{ matrix.rid }}

  publish:
    name: Publish to NuGet.org
    needs: package-test
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v') &&
      github.repository == 'leap71/PicoGK.Core'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: nuget-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PicoGK.Core-NuGet
          path: artifacts/packages

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Select package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one .nupkg, found ${#packages[@]}."
            exit 1
          fi
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

      # Exchanges GitHub's OIDC token for a NuGet.org API key valid for one hour.
      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: >-
          dotnet nuget push "$PACKAGE_PATH"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
