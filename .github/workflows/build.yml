name: Build PicoGK.Core

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-15
            rid: osx-arm64
          - name: Windows-x64
            os: windows-2025
            rid: win-x64

    name: Native / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DPICOGK_RID=${{ matrix.rid }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Runtime
        shell: bash
        run: cmake --build build --config Release --target PicoGKRuntime

      - name: Audit macOS dependency paths
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          native="artifacts/runtimes/${{ matrix.rid }}/native"
          for lib in "$native"/*.dylib; do
            echo "--- $lib"
            otool -L "$lib"
          done
          if otool -L "$native"/*.dylib | grep -E '/opt/homebrew|/usr/local|/Users/|/Volumes/'; then
            echo "Non-relocatable build-machine path found in native artifact."
            exit 1
          fi

      - name: Upload native runtime
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/runtimes/${{ matrix.rid }}/native/
          if-no-files-found: error

  package:
    name: Pack PicoGK.Core
    needs: native
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download macOS runtime
        uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          path: artifacts/runtimes/osx-arm64/native

      - name: Download Windows runtime
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: artifacts/runtimes/win-x64/native

      - name: Pack
        run: >-
          dotnet pack src/PicoGK.Core/PicoGK.Core.csproj
          -c Release
          -o artifacts/packages

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: PicoGK.Core-NuGet
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
